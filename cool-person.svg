<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-labelledby="title desc">
  <title id="title">Стильный герой</title>
  <desc id="desc">Неоновый портрет уверенного лысого молодого человека в очках и куртке</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111826"/><stop offset="1" stop-color="#25133d"/></linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#354b68"/><stop offset=".52" stop-color="#19283d"/><stop offset="1" stop-color="#101a2a"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6bd91"/><stop offset="1" stop-color="#ca795d"/></linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a4ff6b"/><stop offset=".45" stop-color="#36d6c4"/><stop offset="1" stop-color="#3455a8"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#b34cff" stop-opacity=".48"/><stop offset="1" stop-color="#b34cff" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.6"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="800" height="900" rx="48" fill="url(#bg)"/>
  <circle cx="408" cy="392" r="337" fill="url(#halo)"/>
  <circle cx="400" cy="390" r="272" fill="none" stroke="#9b55ff" stroke-opacity=".24" stroke-width="2"/>
  <circle cx="400" cy="390" r="302" fill="none" stroke="#78f2d0" stroke-opacity=".15" stroke-width="2" stroke-dasharray="5 14"/>
  <path d="M61 681h165M577 196h152M90 253h53M658 652h76" stroke="#a5ff6b" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/>
  <circle cx="679" cy="269" r="5" fill="#a5ff6b"/><circle cx="129" cy="612" r="4" fill="#ff64b4"/>
  <ellipse cx="405" cy="793" rx="246" ry="38" fill="#050710" opacity=".65" filter="url(#shadow)"/>
  <!-- jacket and shoulders -->
  <path d="M165 900c10-151 36-249 112-297 41-25 84-39 129-39s96 13 137 40c75 50 101 148 111 296H165Z" fill="url(#coat)" stroke="#607b9d" stroke-opacity=".65" stroke-width="4"/>
  <path d="m279 602 126 101 116-100 55 53-85 126-86-60-84 61-94-124Z" fill="#293c55" stroke="#7186a0" stroke-opacity=".45" stroke-width="3"/>
  <path d="m405 703-48 197h104l-56-197Z" fill="#101b2a"/>
  <path d="m405 704-28 39 28 27 29-28Z" fill="#b34cff"/>
  <path d="M260 639 202 752l82 44 58-115M552 638l57 113-82 45-57-115" fill="none" stroke="#a5ff6b" stroke-opacity=".8" stroke-width="4"/>
  <path d="M405 705v155" stroke="#536d8c" stroke-width="3" stroke-dasharray="7 10"/>
  <rect x="480" y="789" width="41" height="47" rx="7" fill="#172438" stroke="#7991ad" stroke-width="3"/><path d="M491 800h19M491 809h19" stroke="#a5ff6b" stroke-width="3" stroke-linecap="round"/>
  <!-- neck -->
  <path d="M350 531h112v106c0 37-25 64-56 64s-56-27-56-64Z" fill="url(#skin)"/>
  <path d="M350 568c28 30 73 38 112 19v-44H350Z" fill="#a9554b" opacity=".42"/>
  <!-- ears and face -->
  <ellipse cx="283" cy="407" rx="34" ry="56" fill="#d78c6c"/><ellipse cx="526" cy="407" rx="34" ry="56" fill="#d78c6c"/>
  <path d="M291 327c0-101 49-155 114-155s114 54 114 155v111c0 83-50 140-114 140s-114-57-114-140Z" fill="url(#skin)"/>
  <!-- bald scalp highlight -->
  <path d="M329 248c16-43 44-63 77-68" fill="none" stroke="#ffe0b6" stroke-opacity=".55" stroke-width="9" stroke-linecap="round"/>
  <!-- eyebrows / glasses -->
  <path d="M320 350c21-14 50-15 72-4M426 346c24-12 52-10 71 5" fill="none" stroke="#402a2b" stroke-width="9" stroke-linecap="round"/>
  <path d="M302 359q48-22 92 1l-8 48q-35 28-72 3-18-20-12-52Zm125 0q45-23 91 1 4 32-13 52-37 25-72-3Z" fill="#101722" stroke="#a5ff6b" stroke-width="6" stroke-linejoin="round"/>
  <path d="M394 372q16-11 32 0" fill="none" stroke="#a5ff6b" stroke-width="6"/>
  <path d="M316 368q27-10 54-5" stroke="url(#lens)" stroke-width="8" stroke-linecap="round"/><path d="M441 363q28-7 53 5" stroke="url(#lens)" stroke-width="8" stroke-linecap="round"/>
  <!-- nose, expression, details -->
  <path d="M404 392c-5 27-15 54-11 63 4 8 15 10 25 5" fill="none" stroke="#a9564d" stroke-width="5" stroke-linecap="round"/>
  <path d="M370 486q37 20 74-1" fill="none" stroke="#783b42" stroke-width="7" stroke-linecap="round"/>
  <path d="M379 488q29 8 56-1" fill="none" stroke="#f6d0b3" stroke-width="3" stroke-linecap="round"/>
  <path d="M296 447q10 22 22 26M512 447q-10 22-22 26" fill="none" stroke="#9d5b51" stroke-width="4" stroke-linecap="round"/>
  <path d="M340 555q64 32 129-1" fill="none" stroke="#ffca82" stroke-opacity=".8" stroke-width="4"/>
  <!-- title -->
  <text x="400" y="83" fill="#f5f7ef" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="7" text-anchor="middle">STAY BOLD</text>
  <text x="400" y="852" fill="#c5f36b" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="5" text-anchor="middle">OWN YOUR SIGNAL</text>
</svg>

